version: '3.8'

services:
  app:
    build: .
    container_name: intellifutsal_backend
    restart: always
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      - postgres
    environment:
      # Development DB (Docker)
      - DB_DEV_TYPE=${DB_DEV_TYPE}
      - DB_DEV_HOST=${DB_DEV_HOST}
      - DB_DEV_PORT=${DB_DEV_PORT}
      - DB_DEV_USERNAME=${DB_DEV_USERNAME}
      - DB_DEV_PASSWORD=${DB_DEV_PASSWORD}
      - DB_DEV_NAME=${DB_DEV_NAME}
      
      # Production DB (Azure)
      - DB_PROD_TYPE=${DB_PROD_TYPE}
      - DB_PROD_HOST=${DB_PROD_HOST}
      - DB_PROD_PORT=${DB_PROD_PORT}
      - DB_PROD_USERNAME=${DB_PROD_USERNAME}
      - DB_PROD_PASSWORD=${DB_PROD_PASSWORD}
      - DB_PROD_NAME=${DB_PROD_NAME}

      # SendGrid
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      
      # JWT
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      
      # General
      - APP_PORT=${APP_PORT}
      
      # Development
      - NODE_ENV=${NODE_ENV}

      # Migrations
      - RUN_MIGRATIONS=true
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - app-network

  postgres:
    image: postgres:14-alpine
    container_name: intellifutsal_postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_PASSWORD=${DB_DEV_PASSWORD}
      - POSTGRES_USER=${DB_DEV_USERNAME}
      - POSTGRES_DB=${DB_DEV_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_DEV_USERNAME} -d ${DB_DEV_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge