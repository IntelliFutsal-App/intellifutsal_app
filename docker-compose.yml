
services:
  postgres:
    image: postgres:14-alpine
    container_name: intellifutsal_postgres_db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_PROD_USERNAME}
      POSTGRES_PASSWORD: ${DB_PROD_PASSWORD}
      POSTGRES_DB: ${DB_PROD_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./intellifutsal_back/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - intellifutsal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_PROD_USERNAME} -d ${DB_PROD_NAME} -h localhost || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  flask-backend:
    build:
      context: ./intellifutsal_ai_back
      dockerfile: Dockerfile
    container_name: intellifutsal_flask_backend
    restart: always
    environment:
      POSITIONS_MODEL_PATH: ${POSITIONS_MODEL_PATH}
      PHYSICAL_CONDITIONS_MODEL_PATH: ${PHYSICAL_CONDITIONS_MODEL_PATH}
      POSITIONS_SCALER_PATH: ${POSITIONS_SCALER_PATH}
      PHYSICAL_CONDITIONS_SCALER_PATH: ${PHYSICAL_CONDITIONS_SCALER_PATH}
      DEBUG: ${DEBUG}
      HOST: 0.0.0.0
      PORT: 9041
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REQUEST_TIMEOUT: 10
      MAX_CONTENT_LENGTH: 1024000
    volumes:
      - ./intellifutsal_ai_back/app:/app/app
      - ./intellifutsal_ai_back/static:/static
      - ./intellifutsal_ai_back/main.py:/app/main.py
      - ./intellifutsal_ai_back/.env:/app/.env
    networks:
      - intellifutsal-network
    depends_on:
      postgres:
        condition: service_healthy

  nodejs-backend:
    build:
      context: ./intellifutsal_back
      dockerfile: Dockerfile
    container_name: intellifutsal_nodejs_backend
    restart: always
    expose:
      - "9042"
    environment:
      DB_DEV_TYPE: ${DB_DEV_TYPE}
      DB_DEV_HOST: postgres
      DB_DEV_PORT: 5432
      DB_DEV_USERNAME: ${DB_DEV_USERNAME}
      DB_DEV_PASSWORD: ${DB_DEV_PASSWORD}
      DB_DEV_NAME: ${DB_DEV_NAME}

      DB_PROD_TYPE: ${DB_PROD_TYPE}
      DB_PROD_HOST: ${DB_PROD_HOST}
      DB_PROD_PORT: ${DB_PROD_PORT}
      DB_PROD_USERNAME: ${DB_PROD_USERNAME}
      DB_PROD_PASSWORD: ${DB_PROD_PASSWORD}
      DB_PROD_NAME: ${DB_PROD_NAME}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}

      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      APP_PORT: ${APP_PORT}
      NODE_ENV: ${NODE_ENV:-development}
      RUN_MIGRATIONS: "true"

      AI_API_URL: ${AI_API_URL}
      FLASK_BACKEND_URL: http://flask-backend:9041
    volumes:
      - ./intellifutsal_back:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - intellifutsal-network
    depends_on:
      postgres:
        condition: service_healthy
      flask-backend:
        condition: service_started
    command: ["npm", "start"]

  react-frontend:
    build:
      context: ./intellifutsal_front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: intellifutsal_react_frontend
    restart: always
    expose:
      - "80"
    networks:
      - intellifutsal-network
    depends_on:
      - nodejs-backend

  cert-init:
    image: debian:bookworm-slim
    container_name: intellifutsal_cert_init
    environment:
      DOMAIN: ${DOMAIN}
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      apt-get update
      apt-get install -y --no-install-recommends openssl ca-certificates
      rm -rf /var/lib/apt/lists/*
      if [ -z "${DOMAIN}" ]; then
        echo "DOMAIN is not set" >&2
        exit 1
      fi
      if [ ! -f "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem" ]; then
        mkdir -p "/etc/letsencrypt/live/${DOMAIN}"
        openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
          -keyout "/etc/letsencrypt/live/${DOMAIN}/privkey.pem" \
          -out "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem" \
          -subj "/CN=${DOMAIN}"
      fi
    volumes:
      - certbot_conf:/etc/letsencrypt
    networks:
      - intellifutsal-network

  nginx:
    image: nginx:1.27-alpine
    container_name: intellifutsal_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - intellifutsal-network
    depends_on:
      cert-init:
        condition: service_completed_successfully
      react-frontend:
        condition: service_started
      nodejs-backend:
        condition: service_started

  certbot:
    image: certbot/certbot:latest
    container_name: intellifutsal_certbot
    restart: unless-stopped
    entrypoint: /bin/sh -c
    command: "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - intellifutsal-network

volumes:
  postgres_data:
    driver: local
  certbot_conf:
    driver: local
    name: intellifutsal_certbot_conf
  certbot_www:
    driver: local
    name: intellifutsal_certbot_www

networks:
  intellifutsal-network:
    driver: bridge
    name: intellifutsal-network